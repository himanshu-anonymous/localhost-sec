global
    log stdout format raw local0 info
    maxconn 2048
    stats socket /var/run/haproxy.sock mode 666 level admin expose-fd listeners
    stats socket 127.0.0.1:9999 level admin
    stats timeout 30s
    ssl-default-bind-options ssl-min-ver TLSv1.3
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

# Public Healthcheck & Admin Stats (local / internal control plane)
frontend health_stats
    bind 0.0.0.0:8088
    mode http
    monitor-uri /healthz
    stats enable
    stats uri /stats
    stats refresh 5s

# Secure mTLS Ingress Gateway for Access Network
frontend aegis_secure_ingress
    bind 0.0.0.0:8443 ssl crt /etc/haproxy/certs/gateway.pem ca-file /etc/haproxy/certs/ca.crt verify required
    mode http

    # Strip untrusted client-supplied forwarding headers at the edge
    http-request del-header X-Forwarded-For
    http-request del-header X-Real-IP
    http-request del-header X-Client-Cert-DN

    # Insert verified gateway forwarding headers
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Real-IP %[src]
    http-request set-header X-Client-Cert-DN %[ssl_c_s_dn]
    http-request set-header X-Gateway-Enforced "AEGIS-Gateway-v1"

    # Dynamic ACL blocking via persistent/runtime list
    acl is_blocked src -f /etc/haproxy/acl/blocked_ips.lst
    http-request deny deny_status 403 content-type "application/json" string '{"error":"Forbidden","reason":"Source IP blocked by AEGIS Dynamic Policy"}' if is_blocked

    default_backend target_cluster

backend target_cluster
    mode http
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server target_web target-web:8080 check inter 3000ms rise 2 fall 3

