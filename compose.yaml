# ==============================================================================
# AEGIS — Multi-Container Docker Compose Architecture
# Compliant with Section 5 & 6 of AEGIS Master Implementation Specification
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. CORE BACKEND ORCHESTRATOR
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-backend
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql+psycopg2://aegis_admin:aegis_secure_local_dev_password_2026@postgres:5432/aegis_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POLICY_AGENT_TOKEN=aegis-secret-policy-token-2026
      - POLICY_AGENT_URL=http://policy-agent:8090
      - GEMMA_MODEL=gemma-4-it
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aegis_frontend
      - aegis_control
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  # ----------------------------------------------------------------------------
  # 2. PERSISTENT STORAGE — POSTGRESQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis_admin
      POSTGRES_PASSWORD: aegis_secure_local_dev_password_2026
      POSTGRES_DB: aegis_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_admin -d aegis_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aegis_control
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  # ----------------------------------------------------------------------------
  # 3. TELEMETRY & EVENT BROKER — REDIS 7
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aegis_control
      - aegis_observability
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ----------------------------------------------------------------------------
  # 4. SECURE INGRESS GATEWAY — HAPROXY (mTLS + TLS 1.3 + Dynamic ACL)
  # ----------------------------------------------------------------------------
  gateway:
    build:
      context: ./infrastructure/gateway
      dockerfile: Dockerfile
    container_name: aegis-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8088:8088"
    volumes:
      - ./infrastructure/certificates:/etc/haproxy/certs:ro
      - haproxy_socket:/var/run
      - haproxy_acl:/etc/haproxy/acl
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8088/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      aegis_access:
        ipv4_address: 172.31.10.2
      aegis_target:
        ipv4_address: 172.31.20.2
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ----------------------------------------------------------------------------
  # 5. ADAPTIVE POLICY AGENT (Restricted Control Plane)
  # ----------------------------------------------------------------------------
  policy-agent:
    build:
      context: ./infrastructure/policy-agent
      dockerfile: Dockerfile
    container_name: aegis-policy-agent
    restart: unless-stopped
    environment:
      - POLICY_AGENT_TOKEN=aegis-secret-policy-token-2026
      - LAB_ACCESS_SUBNET=172.31.10.0/24
      - HAPROXY_SOCKET_PATH=/var/run/haproxy.sock
      - ACL_FILE_PATH=/etc/haproxy/acl/blocked_ips.lst
    volumes:
      - haproxy_socket:/var/run
      - haproxy_acl:/etc/haproxy/acl
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aegis_control
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ----------------------------------------------------------------------------
  # 6. PROTECTED LAB TARGET WEB SERVICE
  # ----------------------------------------------------------------------------
  target-web:
    build:
      context: ./infrastructure/lab/targets
      dockerfile: Dockerfile
    container_name: aegis-target-web
    restart: unless-stopped
    volumes:
      - lab_logs:/var/log/aegis
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      aegis_target:
        ipv4_address: 172.31.20.10
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ----------------------------------------------------------------------------
  # 7. CONTROLLED ATTACK CLIENT
  # ----------------------------------------------------------------------------
  attacker:
    build:
      context: ./infrastructure/lab/attacker
      dockerfile: Dockerfile
    container_name: aegis-attacker
    restart: "no"
    environment:
      - GATEWAY_URL=https://172.31.10.2:8443
      - CERTS_DIR=/certs
    volumes:
      - ./infrastructure/certificates:/certs:ro
    networks:
      aegis_access:
        ipv4_address: 172.31.10.15
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ----------------------------------------------------------------------------
  # 8. NETWORK MONITORING & IDS — SURICATA
  # ----------------------------------------------------------------------------
  suricata:
    image: jasonish/suricata:latest
    container_name: aegis-suricata
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./infrastructure/suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - ./infrastructure/suricata/rules:/etc/suricata/rules
      - suricata_logs:/var/log/suricata
    command: -i eth0 -c /etc/suricata/suricata.yaml
    networks:
      - aegis_access
      - aegis_observability
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

# ==============================================================================
# ISOLATED DOCKER NETWORKS
# ==============================================================================
networks:
  aegis_frontend:
    name: aegis_frontend
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.1.0/24

  aegis_control:
    name: aegis_control
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.2.0/24

  aegis_observability:
    name: aegis_observability
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.3.0/24

  aegis_access:
    name: aegis_access
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.10.0/24

  aegis_target:
    name: aegis_target
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.20.0/24

# ==============================================================================
# PERSISTENT VOLUMES
# ==============================================================================
volumes:
  postgres_data:
    name: aegis_postgres_data
  haproxy_socket:
    name: aegis_haproxy_socket
  haproxy_acl:
    name: aegis_haproxy_acl
  lab_logs:
    name: aegis_lab_logs
  suricata_logs:
    name: aegis_suricata_logs

