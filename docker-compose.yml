services:
  # Persistent Relational Database (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: localhost-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: localhost_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - localhost-net

  # Ephemeral Runtime Graph Database (Neo4j 5)
  neo4j:
    image: neo4j:5-community
    container_name: localhost-neo4j
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/neo4jpassword
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 512m
    restart: unless-stopped
    networks:
      - localhost-net

  # Telemetry & Event Broker (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: localhost-redis
    ports:
      - "6380:6379"
    restart: unless-stopped
    networks:
      - localhost-net

  # Docker Environment Worker A (Baseline)
  worker-a:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: localhost-worker-a
    ports:
      - "8001:8000"
    environment:
      - ENV_ID=env_a_baseline
      - SCENARIO_NAME=black_sky
      - POLICY_PROFILE=baseline
      - PORT=8000
    networks:
      - localhost-net

  # Docker Environment Worker B (Adaptive DDPS + Shared PPO)
  worker-b:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: localhost-worker-b
    ports:
      - "8002:8000"
    environment:
      - ENV_ID=env_b_adaptive
      - SCENARIO_NAME=black_sky
      - POLICY_PROFILE=none
      - PORT=8000
    networks:
      - localhost-net

  # Docker Environment Worker C (Hardened Zero-Trust)
  worker-c:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: localhost-worker-c
    ports:
      - "8003:8000"
    environment:
      - ENV_ID=env_c_hardened
      - SCENARIO_NAME=black_sky
      - POLICY_PROFILE=hardened
      - PORT=8000
    networks:
      - localhost-net

  # Docker Environment Worker D (Experimental RL Agent)
  worker-d:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: localhost-worker-d
    ports:
      - "8004:8000"
    environment:
      - ENV_ID=env_d_experimental
      - SCENARIO_NAME=black_sky
      - POLICY_PROFILE=none
      - PORT=8000
    networks:
      - localhost-net

volumes:
  postgres-data:
    name: localhost-postgres-data

networks:
  localhost-net:
    name: localhost-net
    driver: bridge
