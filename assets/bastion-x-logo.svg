<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="200" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Grid lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.75">
    <line x1="40" y1="40" x2="760" y2="40"/>
    <line x1="40" y1="100" x2="760" y2="100"/>
    <line x1="40" y1="160" x2="760" y2="160"/>
    <line x1="160" y1="20" x2="160" y2="180"/>
    <line x1="320" y1="20" x2="320" y2="180"/>
    <line x1="480" y1="20" x2="480" y2="180"/>
    <line x1="640" y1="20" x2="640" y2="180"/>
  </g>

  <!-- Shield Icon Emblem -->
  <g transform="translate(60, 28)">
    <!-- Outer Shield Glow -->
    <path d="M 70 8 L 126 32 C 126 90 98 126 70 144 C 42 126 14 90 14 32 Z" 
          fill="none" stroke="url(#shieldGrad)" stroke-width="3" filter="url(#glow)"/>
    
    <!-- Inner Shield Shape -->
    <path d="M 70 14 L 120 36 C 120 86 95 118 70 134 C 45 118 20 86 20 36 Z" 
          fill="#0c162d" stroke="#334155" stroke-width="1"/>

    <!-- Neural Network Node Graph inside Shield -->
    <g stroke="#06b6d4" stroke-width="1.5" opacity="0.85">
      <line x1="70" y1="45" x2="45" y2="75"/>
      <line x1="70" y1="45" x2="95" y2="75"/>
      <line x1="45" y1="75" x2="70" y2="105"/>
      <line x1="95" y1="75" x2="70" y2="105"/>
      <line x1="45" y1="75" x2="95" y2="75" stroke-dasharray="2 2" stroke="#dc2626"/>
    </g>

    <!-- Nodes -->
    <circle cx="70" cy="45" r="5" fill="#38bdf8"/>
    <circle cx="45" cy="75" r="4.5" fill="#10b981"/>
    <circle cx="95" cy="75" r="4.5" fill="#ef4444"/>
    <circle cx="70" cy="105" r="5.5" fill="url(#coreGrad)"/>
  </g>

  <!-- Typography -->
  <!-- Main Title -->
  <text x="230" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="48" font-weight="900" letter-spacing="4" fill="#ffffff">
    BASTION <tspan fill="#ef4444">X</tspan>
  </text>

  <!-- Tagline -->
  <text x="232" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="14" font-weight="600" letter-spacing="2" fill="#38bdf8">
    ADAPTIVE MULTI-LAYER NETWORK DEFENCE SIMULATOR
  </text>

  <!-- Sub-label description -->
  <text x="232" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="12" font-weight="400" fill="#94a3b8">
    Shared-Policy PPO Reinforcement Learning · Dynamic Policy Stack (DDPS) · MITRE ATT&amp;CK Containers
  </text>

  <!-- Status Chip -->
  <g transform="translate(680, 32)">
    <rect width="80" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#34d399"/>
    <text x="22" y="16" font-family="monospace" font-size="10" font-weight="700" fill="#a7f3d0">ONLINE</text>
  </g>
</svg>
